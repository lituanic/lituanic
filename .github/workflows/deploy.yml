name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.repository == vars.DEPLOY_REPO &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/lituanic &&
            git pull --ff-only &&
            bun install --frozen-lockfile &&
            sudo systemctl restart lituanic &&
            sleep 3 &&
            curl -sf http://localhost:9200/health || {
              git checkout HEAD~1 &&
              bun install --frozen-lockfile &&
              sudo systemctl restart lituanic &&
              echo 'ROLLED BACK' && exit 1
            }
          "
